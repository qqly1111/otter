<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f9d59">
<title>考公打卡 · 考拉</title>
<style>
:root{
  --bg:#f2f5f3;--card:#fff;--text:#16231d;--sub:#7b8883;--line:#eaeff0;
  --green:#1f9d59;--green2:#31c072;--green-bg:#e9f7ef;--green-ink:#186b40;
  --amber:#e0952a;--amber-bg:#fdf4e3;--red:#d9534f;--blue:#3b82c4;
  --sh:0 2px 6px rgba(18,52,36,.05),0 10px 26px -12px rgba(18,52,36,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{
  background:var(--bg);color:var(--text);padding:12px 14px 44px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;}
button{font-family:inherit;cursor:pointer;}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:5px;margin-bottom:12px;position:sticky;top:0;z-index:9;
  background:rgba(242,245,243,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 0;margin-top:-12px;}
.tabs button{flex:1;border:none;background:#e6ece9;color:#6a7a72;border-radius:12px;
  padding:11px 0;font-size:13px;font-weight:600;transition:.18s;}
.tabs button.on{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;
  box-shadow:0 6px 14px -6px rgba(31,157,89,.75);}

/* ---------- card ---------- */
.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--sh);}
.ct{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.ct .p{font-size:11px;font-weight:500;color:var(--sub);}
.sec{font-size:11px;color:var(--sub);font-weight:700;margin:14px 2px 7px;letter-spacing:.6px;}

/* ---------- hero ---------- */
.hero{background:linear-gradient(140deg,#22a95f 0%,#1c8f50 55%,#157a45 100%);
  color:#fff;position:relative;overflow:hidden;padding:16px 16px 15px;}
.hero:after{content:"";position:absolute;right:-40px;top:-56px;width:170px;height:170px;
  border-radius:50%;background:rgba(255,255,255,.10);}
.hero:before{content:"";position:absolute;right:34px;bottom:-62px;width:110px;height:110px;
  border-radius:50%;background:rgba(255,255,255,.08);}
.heroTop{display:flex;justify-content:space-between;align-items:center;position:relative;}
.htitle{font-size:17px;font-weight:800;letter-spacing:.3px;}
.hb{font-size:11px;background:rgba(255,255,255,.20);padding:5px 10px;border-radius:20px;font-weight:600;}
.hb b{font-size:15px;}
.hnav{display:flex;align-items:center;gap:10px;margin-top:14px;position:relative;}
.hnav button{border:none;background:rgba(255,255,255,.18);color:#fff;width:30px;height:30px;
  border-radius:10px;font-size:12px;line-height:1;transition:.15s;}
.hnav button:active{background:rgba(255,255,255,.34);}
.hdate{font-size:14px;font-weight:700;flex:1;text-align:center;letter-spacing:.4px;}
.hdate.off{color:#ffe6a8;}
.hprog{display:flex;align-items:center;gap:13px;margin-top:15px;position:relative;}
.ring{position:relative;width:66px;height:66px;border-radius:50%;flex:none;
  background:conic-gradient(#ffffff calc(var(--p)*1%), rgba(255,255,255,.25) 0);}
.ring i{position:absolute;inset:6px;border-radius:50%;background:#1d9454;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:14px;}
.hpinfo{min-width:0;}
.hpt{font-size:13px;font-weight:700;}
.hps{font-size:11px;opacity:.85;margin-top:3px;}

/* ---------- task ---------- */
.task{display:grid;grid-template-columns:24px 1fr auto 18px;gap:9px;align-items:center;
  padding:9px 11px;border-radius:14px;border:1px solid var(--line);margin-bottom:7px;
  transition:background .18s,border-color .18s,transform .1s;cursor:pointer;user-select:none;background:#fff;}
.task:active{transform:scale(.988);}
.task .box{width:24px;height:24px;border-radius:8px;border:2px solid #d3dbd8;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.18s;}
.task .txt{min-width:0;font-size:14px;line-height:1.25;word-break:break-all;}
.task .data{display:flex;align-items:center;gap:3px;}
.task .din{width:33px;border:1px solid var(--line);border-radius:9px;padding:6px 0;font-size:12px;
  outline:none;background:#fbfdfc;text-align:center;color:var(--text);transition:.15s;}
.task .din:focus{border-color:var(--green2);background:#fff;box-shadow:0 0 0 3px rgba(49,192,114,.13);}
.task .u{font-size:10px;color:var(--sub);white-space:nowrap;}
.task .s{font-size:12px;color:#c3ccc8;}
.task.done{background:linear-gradient(180deg,#eefaf3,#e6f7ee);border-color:#bfe7d0;}
.task.done .box{background:linear-gradient(135deg,var(--green2),var(--green));border-color:transparent;
  box-shadow:0 3px 8px -3px rgba(31,157,89,.7);}
.task.done .txt{color:#57716a;text-decoration:line-through;text-decoration-color:#b9d6c5;}
.task.half{background:linear-gradient(180deg,#fef8ea,#fdf3e0);border-color:#f0dcb0;}
.task.half .box{background:linear-gradient(135deg,#f0b04a,#dd8e22);border-color:transparent;}
.task.half .txt{color:#8a6a25;}
.task .del{color:#ccd5d1;font-size:18px;text-align:center;line-height:1;}
@keyframes fl{0%{box-shadow:0 0 0 0 rgba(49,192,114,.55);background:#eafff2;}100%{box-shadow:0 0 0 0 rgba(49,192,114,0);}}
.task.flash{animation:fl 1.3s ease;}

/* ---------- inputs ---------- */
.addrow{display:flex;gap:7px;margin-top:11px;align-items:center;}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px;
  font-size:14px;outline:none;background:#fafcfb;transition:.15s;color:var(--text);}
.addrow input:focus{border-color:var(--green2);background:#fff;box-shadow:0 0 0 3px rgba(49,192,114,.13);}
.addrow input.err{border-color:var(--red);background:#fdeeeb;}
.addrow button{border:none;background:#eef4f0;color:#37724e;border-radius:11px;padding:0 11px;
  height:40px;font-size:12px;font-weight:700;white-space:nowrap;transition:.15s;}
.addrow button:active{opacity:.75;}
.addrow button.solid{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;
  box-shadow:0 6px 14px -8px rgba(31,157,89,.9);}
.addrow .lbl{font-size:12px;color:var(--sub);white-space:nowrap;}

/* ---------- week grid ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.day{border-radius:12px;padding:9px 2px;text-align:center;background:#f7faf8;border:1px solid var(--line);transition:.15s;}
.day .d{font-size:10px;color:var(--sub);}
.day .n{font-size:12px;font-weight:700;margin-top:3px;}
.day.full{background:linear-gradient(180deg,#e9f7ef,#dff4e8);border-color:#bfe7d0;}
.day.full .n{color:var(--green);}
.day.today{border-color:var(--green);border-width:2px;}
.day.view{border-color:var(--amber);border-width:2px;box-shadow:0 0 0 3px rgba(224,149,42,.13);}
.day .n.zero{color:#c9d3cf;font-weight:500;}
.weekstat{font-size:12px;color:#3f5a4c;background:#f3f8f5;border-radius:12px;padding:10px 12px;
  margin-top:11px;line-height:1.6;}
.weekstat b{color:var(--green-ink);}

/* ---------- buttons ---------- */
.copybtn{width:100%;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;border:none;
  border-radius:14px;padding:14px;font-size:15px;font-weight:700;margin-bottom:9px;
  box-shadow:0 10px 22px -12px rgba(31,157,89,.95);transition:.15s;}
.copybtn.alt{background:#eef4f0;color:#37724e;box-shadow:none;margin-bottom:0;}
.copybtn:active{transform:scale(.985);opacity:.94;}
.foot{text-align:center;margin-top:8px;}
.foot button{background:none;border:none;color:#a9b4af;font-size:12px;padding:9px;}
.empty{text-align:center;color:var(--sub);font-size:12px;padding:18px 10px;line-height:1.6;}

/* ---------- mock ---------- */
.seg{display:flex;gap:6px;margin-bottom:12px;background:#e6ece9;padding:5px;border-radius:14px;}
.seg button{flex:1;border:none;background:transparent;color:#6a7a72;border-radius:10px;padding:9px 0;
  font-size:13px;font-weight:700;transition:.18s;}
.seg button.on{background:#fff;color:var(--green-ink);box-shadow:0 2px 6px rgba(18,52,36,.10);}
.mrow{display:grid;grid-template-columns:1fr 32px 32px 13px 32px 13px;gap:4px;align-items:center;margin-bottom:6px;}
.mrow .mn{font-size:12px;color:#3f5a4c;line-height:1.2;}
.mrow .mni{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 0;font-size:12px;
  text-align:center;outline:none;background:#fafcfb;color:var(--text);transition:.15s;}
.mrow .mni:focus{border-color:var(--green2);background:#fff;box-shadow:0 0 0 3px rgba(49,192,114,.13);}
.mrow .mu{font-size:10px;color:var(--sub);text-align:center;}
.mtable{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;margin-top:8px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.mtable th,.mtable td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);}
.mtable tr:last-child th,.mtable tr:last-child td{border-bottom:none;}
.mtable th{background:#f5f9f7;color:#4b7a5f;font-weight:700;font-size:10.5px;}
.mtable tr:last-child td{background:#fbfdfc;font-weight:600;}
.g{color:#1f9d59;font-weight:700;}.y{color:#d98324;font-weight:700;}.r{color:var(--red);font-weight:700;}
.note{font-size:10.5px;color:var(--sub);margin-top:8px;line-height:1.6;}

/* ---------- history ---------- */
.mk{border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;
  background:#fff;transition:.15s;}
.mk.open{border-color:#bfe7d0;background:linear-gradient(180deg,#fbfefc,#f5fbf7);}
.mk .top{display:grid;grid-template-columns:1fr 20px;gap:8px;align-items:center;cursor:pointer;}
.mk .t{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;}
.mk .t .tv{color:var(--green);}
.mk .sm{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5;}
.mk .dx{color:#c3ccc8;font-size:12px;text-align:center;}
.bl{font-size:10.5px;color:var(--sub);}
.bl .u2{color:#1f9d59;font-weight:700;}.bl .d2{color:var(--red);font-weight:700;}
.delbtn{display:inline-block;font-size:11px;color:var(--red);padding:6px 12px;border-radius:9px;
  background:#fdeeeb;font-weight:600;}

/* ---------- chart ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible;}
.ct2{font-size:8px;fill:#9aa6a1;font-family:inherit;}
.cv{font-size:8.5px;fill:#4b7a5f;font-weight:700;font-family:inherit;}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.lg{display:flex;align-items:center;gap:4px;font-size:10.5px;padding:4px 8px;border-radius:20px;
  background:#f4f8f6;color:#4b7a5f;border:1px solid transparent;transition:.15s;user-select:none;}
.lg i{width:8px;height:8px;border-radius:50%;display:block;}
.lg.off{opacity:.35;text-decoration:line-through;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.kpi{background:#f5f9f7;border-radius:12px;padding:9px 6px;text-align:center;}
.kpi b{display:block;font-size:16px;color:var(--green);line-height:1.25;}
.kpi span{font-size:10px;color:var(--sub);}

@media print{.tabs,.foot,.copybtn,.seg,.addrow,.legend{display:none!important;}
  body{background:#fff;padding:0;}.card{box-shadow:none;border:1px solid var(--line);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button data-tab="day" class="on">📅 打卡</button>
    <button data-tab="mock">📈 模考</button>
    <button data-tab="week">📄 周复盘</button>
  </div>

  <div id="tab-day">
    <div class="card hero">
      <div class="heroTop">
        <div class="htitle">🦦 考公打卡</div>
        <div class="hb">连续 <b id="streak">0</b> 天</div>
      </div>
      <div class="hnav">
        <button id="prevDay">◀</button>
        <div class="hdate" id="todayTxt" title="点我回到今天"></div>
        <button id="nextDay">▶</button>
      </div>
      <div class="hprog">
        <div class="ring" id="ringWeek"><i id="ringTxt">0%</i></div>
        <div class="hpinfo">
          <div class="hpt" id="progTxt">今日 0/0</div>
          <div class="hps" id="weekStatHero"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div id="secs"></div>
      <div class="addrow">
        <input id="newTask" placeholder="加一条，如：立体图推" maxlength="30">
        <button id="addFocus">🎯攻克</button>
        <button id="addCustom">📌任务</button>
      </div>
    </div>
    <div class="card">
      <div class="ct">本周概览 <span class="p">周一 → 周日</span></div>
      <div class="week" id="week"></div>
      <div class="weekstat" id="weekStat"></div>
    </div>
    <div class="card">
      <button class="copybtn" id="copyBtn">📋 复制当天完成情况</button>
      <button class="copybtn alt" id="importBtn">📥 导入次日计划</button>
    </div>
    <div class="foot"><button id="reset">清空全部打卡记录</button></div>
  </div>

  <div id="tab-mock" style="display:none">
    <div class="seg" id="mockType">
      <button data-t="行测" class="on">📘 行测</button>
      <button data-t="职测">📗 职测</button>
    </div>

    <div class="card">
      <div class="ct">录入 <span class="p" id="mockDate"></span></div>
      <div id="mockRows"></div>
      <div class="addrow" style="margin-top:11px">
        <span class="lbl">日期</span>
        <input id="mockDay" inputmode="numeric" placeholder="MMDD，留空=今天" style="flex:1.3">
        <span class="lbl">总分</span>
        <input id="mockTotal" inputmode="numeric" placeholder="模考方给分" style="flex:1">
      </div>
      <div class="addrow">
        <span class="lbl">击败比</span>
        <input id="mockBeat" inputmode="numeric" placeholder="如 93.7" style="flex:1">
        <span class="lbl">%</span>
        <button id="mockSave" class="solid" style="flex:1.2">保存本次模考</button>
      </div>
    </div>

    <div class="card">
      <div class="ct">本次效率表 <span class="p" id="mockSum"></span></div>
      <div id="mockResult"><div class="empty">填完数字 → 点「保存」→ 这里出效率表</div></div>
    </div>

    <div class="card">
      <div class="ct">总分趋势 <span class="p" id="totalTip"></span></div>
      <div id="totalChart"><div class="empty">至少 2 次记录才能画趋势</div></div>
      <div class="kpis" id="totalKpis"></div>
    </div>

    <div class="card">
      <div class="ct">各模块效率趋势 <span class="p">点下方色标可开关</span></div>
      <div id="effChart"><div class="empty">至少 2 次记录才能画趋势</div></div>
      <div class="legend" id="effLegend"></div>
      <div class="note">效率＝模块得分 ÷ 用时（分/分钟）。🟢≥1.0 ｜ 🟡0.6–1.0 ｜ 🔴&lt;0.6</div>
    </div>

    <div class="card">
      <div class="ct">历史模考 <span class="p">点卡片看明细</span></div>
      <div id="mockList"><div class="empty">还没有记录</div></div>
    </div>
  </div>

  <div id="tab-week" style="display:none">
    <div class="card">
      <div class="ct">本周复盘 <span class="p">周一 → 周日</span></div>
      <div id="weekReport"><div class="empty">加载中…</div></div>
      <button class="copybtn alt" id="printBtn" style="margin-top:12px">🖨️ 导出 / 打印为 PDF</button>
    </div>
  </div>
</div>

      var sc=r*m.p; var e=mi>0?sc/mi:0;

      rows.push({m:m,r:r,mi:mi,sc:sc,e:e,has:!!d.r||!!d.mm||!!d.ss});

  function renderMockList(){
    var el=document.getElementById('mockList');
    var list=mocks.filter(function(m){ return m.type===mockType; });
    if(!list.length){ el.innerHTML='<div class="empty">还没有'+mockType+'记录</div>'; return; }
    var h='';
    list.slice().reverse().forEach(function(mm,idx,arr){
      var c=calcMock(mm);
      var prev=arr[idx+1];
      var pc=prev?calcMock(prev):null;
      var cmp='';
      if(pc){
        var dE=(c.totMin?(c.totScore/c.totMin):0)-(pc.totMin?(pc.totScore/pc.totMin):0);
        cmp='<span class="bl">vs上次 效率 <span class="'+(dE>=0?'u2':'d2')+'">'+(dE>=0?'↑':'↓')+Math.abs(dE).toFixed(2)+'</span></span>';
      }
      var isOpen=(openId===mm.id);
      h+='<div class="mk'+(isOpen?' open':'')+'"><div class="top" data-open="'+mm.id+'">'+
         '<div><div class="t"><span>'+mm.date.slice(5)+' 周'+weekNames[new Date(mm.date+"T00:00:00").getDay()]+'</span><span class="tv">'+dispTotal(mm,c)+' / '+fullMark(mm.type)+'</span></div>'+
         '<div class="sm">对 '+c.totNum+'/'+MOCK_TYPES[mm.type].total+'（'+Math.round(c.totNum/MOCK_TYPES[mm.type].total*100)+'%） ｜ 用时 '+c.totMin+'min ｜ 效率 '+(c.totMin?(c.totScore/c.totMin).toFixed(2):'-')+(mm.beat!=null?(' ｜ 击败 '+mm.beat+'%'):'')+'</div>'+
         (cmp?'<div class="sm">'+cmp+'</div>':'')+'</div><div class="dx">'+(isOpen?'▲':'▼')+'</div></div>';
      if(isOpen){
        h+='<div class="detail"><table class="mtable"><tr><th>模块</th><th>对/题</th><th>用时</th><th>效率</th></tr>';
        c.rows.forEach(function(x){
          if(!x.has) return;
          var g=grade(x.e);
          h+='<tr><td>'+x.m.n+'</td><td>'+x.r+'/'+x.m.q+'</td><td>'+(x.mi?x.mi.toFixed(1):'-')+'</td><td class="'+g[0]+'">'+g[1]+' '+(x.mi?x.e.toFixed(2):'-')+'</td></tr>';
        });
        h+='</table><div style="text-align:right;margin-top:9px"><span class="delbtn" data-del="'+mm.id+'">删除这条</span></div></div>';
      }
      h+='</div>';
    });
    el.innerHTML=h;
    el.querySelectorAll('.top').forEach(function(t){
      t.addEventListener('click',function(){ var id=t.getAttribute('data-open'); openId=(openId===id?null:id); renderMockList(); });
    });
    el.querySelectorAll('.delbtn').forEach(function(b){
      b.addEventListener('click',function(e){
        e.stopPropagation();
        var id=b.getAttribute('data-del');
        if(!confirm('删除这条模考记录？')) return;
        mocks=mocks.filter(function(x){return x.id!==id;});
        if(lastMock && lastMock.id===id) lastMock=null;
        openId=null; saveMocks(); renderMockList(); renderCharts();
      });
    });
  }

  /* ================= 图表 ================= */
  function range(vals){
    var vs=vals.filter(function(v){return v!=null && isFinite(v);});
    if(!vs.length) return [0,1];
    var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
    if(mn===mx){ mn-=1; mx+=1; }
    var d=(mx-mn)*0.18;
    return [Math.max(0,mn-d), mx+d];
  }
  function svgChart(cfg){
    var W=340, H=cfg.h||170, pl=34, pr=12, pt=18, pb=26;
    var iw=W-pl-pr, ih=H-pt-pb, n=cfg.labels.length;
    var yMin=cfg.yMin, yMax=cfg.yMax, rng=(yMax-yMin)||1;
    function X(i){ return n<=1? pl+iw/2 : pl+iw*i/(n-1); }
    function Y(v){ return pt+ih-(v-yMin)/rng*ih; }
    var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" preserveAspectRatio="xMidYMid meet">';
    s+='<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">'+
       '<stop offset="0%" stop-color="'+cfg.areaColor+'" stop-opacity=".28"/>'+
       '<stop offset="100%" stop-color="'+cfg.areaColor+'" stop-opacity="0"/></linearGradient></defs>';
    for(var g=0;g<=4;g++){
      var v=yMin+rng*g/4, y=Y(v);
      s+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="#eef2f0" stroke-width="1"/>';
      s+='<text x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" class="ct2">'+cfg.yFmt(v)+'</text>';
    }
    var step=Math.ceil(n/5);
    cfg.labels.forEach(function(L,i){
      if(i!==0 && i!==n-1 && (i%step!==0)) return;
      s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="ct2">'+L+'</text>';
    });
    cfg.series.forEach(function(se){
      if(se.hidden) return;
      var segs=[], seg=[];
      se.pts.forEach(function(p){
        if(p.v==null || !isFinite(p.v)){ if(seg.length){segs.push(seg);seg=[];} return; }
        seg.push(p);
      });
      if(seg.length) segs.push(seg);
      if(se.area && segs.length===1 && segs[0].length>1){
        var sg=segs[0];
        var ap='M '+X(sg[0].i).toFixed(1)+','+(pt+ih).toFixed(1);
        sg.forEach(function(p){ ap+=' L '+X(p.i).toFixed(1)+','+Y(p.v).toFixed(1); });
        ap+=' L '+X(sg[sg.length-1].i).toFixed(1)+','+(pt+ih).toFixed(1)+' Z';
        s+='<path d="'+ap+'" fill="url(#ag)" stroke="none"/>';
      }
      segs.forEach(function(sg){
        if(sg.length>1){
          var d=sg.map(function(p){return X(p.i).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
          s+='<polyline points="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.w||2)+'" stroke-linejoin="round" stroke-linecap="round"/>';
        }
        sg.forEach(function(p){
          s+='<circle cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(se.w>=2.4?3.2:2.4)+'" fill="#fff" stroke="'+se.color+'" stroke-width="2"/>';
        });
      });
      if(se.vals){
        se.pts.forEach(function(p){
          if(p.v==null||!isFinite(p.v)) return;
          s+='<text x="'+X(p.i).toFixed(1)+'" y="'+(Y(p.v)-7).toFixed(1)+'" text-anchor="middle" class="cv">'+(cfg.yFmt(p.v))+'</text>';
        });
      }
    });
    s+='</svg>';
    return s;
  }
  function mockSeries(){
    return mocks.filter(function(m){ return m.type===mockType; })
      .sort(function(a,b){ return (a.date<b.date?-1:(a.date>b.date?1:0)); });
  }
  function renderCharts(){
    var list=mockSeries();
    var labels=list.map(function(m){ return m.date.slice(5); });
    var calcs=list.map(function(m){ return calcMock(m); });
    var nice=niceDate(labels);
    var tTip=document.getElementById('totalTip');
    var tBox=document.getElementById('totalChart');
    var eBox=document.getElementById('effChart');
    var lBox=document.getElementById('effLegend');
    var kBox=document.getElementById('totalKpis');

    if(list.length<2){
      tBox.innerHTML='<div class="empty">至少 2 次'+mockType+'记录才能画趋势<br>（现在 '+list.length+' 次）</div>';
      eBox.innerHTML='<div class="empty">至少 2 次'+mockType+'记录才能画趋势</div>';
      lBox.innerHTML=''; kBox.innerHTML=''; tTip.textContent=''; return;
    }
    tTip.textContent=mockType+' · 满分 '+fullMark(mockType);

    // 总分趋势
    var totals=list.map(function(m,i){ var v=parseFloat(m.total); return isFinite(v)?v:calcs[i].totScore; });
    var tr=range(totals);
    var tHtml=svgChart({
      labels:labels, yMin:tr[0], yMax:Math.min(fullMark(mockType), tr[1]),
      yFmt:function(v){ return Math.round(v); },
      areaColor:'#1f9d59',
      series:[{color:'#1f9d59',w:2.6,area:true,vals:true,pts:totals.map(function(v,i){return {i:i,v:v};})}]
    });
    tBox.innerHTML=tHtml;

    var mx=Math.max.apply(null,totals), avg=totals.reduce(function(a,b){return a+b;},0)/totals.length;
    var last=totals[totals.length-1], first=totals[0];
    var delta=last-first;
    kBox.innerHTML='<div class="kpi"><b>'+last+'</b><span>最近一次</span></div>'+
      '<div class="kpi"><b>'+avg.toFixed(1)+'</b><span>平均分</span></div>'+
      '<div class="kpi"><b style="color:'+(delta>=0?'#1f9d59':'#d9534f')+'">'+(delta>=0?'+':'')+delta.toFixed(1)+'</b><span>较首次</span></div>';

    // 效率趋势
    var mods=MOCK_TYPES[mockType].mods;
    Object.keys(effOn).length || mods.forEach(function(m){ effOn[m.k]=true; });
    var allE=[], series=[];
    mods.forEach(function(m){
      var pts=list.map(function(mm,i){
        var row=null;
        calcs[i].rows.forEach(function(r){ if(r.m.k===m.k) row=r; });
        var v=(row && row.has && row.mi>0)? (row.sc/row.mi) : null;
        if(v!=null) allE.push(v);
        return {i:i, v:v};
      });
      series.push({key:m.k,name:m.n,color:MCOL[m.k]||'#888',w:2,pts:pts,hidden:!effOn[m.k]});
    });
    var er=range(allE.length?allE:[1]);
    eBox.innerHTML=svgChart({
      labels:labels, yMin:er[0], yMax:er[1],
      yFmt:function(v){ return v.toFixed(1); },
      areaColor:'#1f9d59', series:series
    });
    lBox.innerHTML=mods.map(function(m){
      return '<span class="lg'+(effOn[m.k]?'':' off')+'" data-k="'+m.k+'"><i style="background:'+MCOL[m.k]+'"></i>'+m.n+'</span>';
    }).join('');
    lBox.querySelectorAll('.lg').forEach(function(l){
      l.addEventListener('click',function(){
        var k=l.getAttribute('data-k'); effOn[k]=!effOn[k]; renderCharts();
      });
    });
  }
  function niceDate(labels){ return labels; }

  /* ================= 周复盘 ================= */
  function weekReport(){
    var now=new Date(), tt=ymd(now);
    var ms=monday(now);
    var xc=0,sl=0,doneN=0,totN=0,days=0,detail=[];
    for(var i=0;i<7;i++){
      var d=new Date(ms); d.setDate(ms.getDate()+i);
      var td=ymd(d); if(td>tt) break;
      var ts=allTasks(td,d.getDay()); if(!ts.length) continue;
      days++;
      var c=0; ts.forEach(function(x){ var s=getState(td,x); c+=(s===1?1:(s===2?0.5:0)); });
      doneN+=c; totN+=ts.length;
      var n=countT3(td,d.getDay()); xc+=n.xc; sl+=n.sl;
      detail.push({td:td,c:c,t:ts.length});
    }
    var a=(ms.getMonth()+1)+'/'+ms.getDate();
    var b='';
    if(days>0){ var ld=new Date(ms); ld.setDate(ms.getDate()+days-1); b=(ld.getMonth()+1)+'/'+ld.getDate(); }
    var wkMocks=mocks.filter(function(mm){ var md=new Date(mm.date+'T00:00:00'); return md>=ms && md<=now; });
    var h='<div class="weekstat" style="margin:0 0 10px">📅 本周 '+a+(b?('–'+b):'')+' ｜ 打卡 '+days+' 天</div>';
    h+='<table class="mtable"><tr><th>指标</th><th>数值</th></tr>'+
       '<tr><td>任务完成率</td><td>'+((totN?Math.round(doneN/totN*100):0)+'%（'+doneN+'/'+totN+'）')+'</td></tr>'+
       '<tr><td>行测做题量</td><td>'+xc+' 题</td></tr>'+
       '<tr><td>申论做题量</td><td>'+sl+' 道</td></tr>'+
       '<tr><td>模考次数</td><td>'+wkMocks.length+' 次</td></tr></table>';
    if(detail.length){
      h+='<div class="sec">每日完成</div><table class="mtable"><tr><th>日期</th><th>完成</th></tr>';
      detail.forEach(function(x){ h+='<tr><td>'+x.td.slice(5)+'</td><td>'+x.c+'/'+x.t+'</td></tr>'; });
      h+='</table>';
    }
    if(wkMocks.length){
      h+='<div class="sec">本周模考</div><table class="mtable"><tr><th>日期</th><th>类型</th><th>总分</th><th>效率</th></tr>';
      wkMocks.forEach(function(mm){ var c=calcMock(mm);
        h+='<tr><td>'+mm.date.slice(5)+'</td><td>'+mm.type+'</td><td>'+dispTotal(mm,c)+'</td><td>'+(c.totMin?(c.totScore/c.totMin).toFixed(2):'-')+'</td></tr>'; });
      h+='</table>';
    }
    h+='<div class="sec">复盘（AI 撰写）</div><div class="weekstat">（复盘正文由 AI 生成后粘贴到这里）</div>';
    document.getElementById('weekReport').innerHTML=h;
  }

  /* ================= 事件 ================= */
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      var t=b.getAttribute('data-tab');
      document.getElementById('tab-day').style.display=(t==='day'?'':'none');
      document.getElementById('tab-mock').style.display=(t==='mock'?'':'none');
      document.getElementById('tab-week').style.display=(t==='week'?'':'none');
      if(t==='mock'){ renderMockRows(); renderMockList(); renderCharts(); }
      if(t==='week'){ weekReport(); }
      window.scrollTo(0,0);
    });
  });
  document.querySelectorAll('#mockType button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('#mockType button').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on'); mockType=b.getAttribute('data-t'); openId=null; effOn={};
      renderMockRows(); renderMockList(); renderCharts();
    });
  });
  document.getElementById('mockSave').addEventListener('click',saveMock);
  document.getElementById('printBtn').addEventListener('click',function(){ window.print(); });
  document.getElementById('prevDay').addEventListener('click',function(){ viewDate.setDate(viewDate.getDate()-1); render(); });
  document.getElementById('nextDay').addEventListener('click',function(){ viewDate.setDate(viewDate.getDate()+1); render(); });
  document.getElementById('todayTxt').addEventListener('click',function(){ viewDate=new Date(); render(); });
  document.getElementById('addFocus').addEventListener('click',function(){ addItem('focus'); });
  document.getElementById('addCustom').addEventListener('click',function(){ addItem('custom'); });
  document.getElementById('newTask').addEventListener('keydown',function(e){ if(e.key==='Enter') addItem('focus'); });
  document.getElementById('copyBtn').addEventListener('click',function(){ copyText(buildText()); });
  document.getElementById('importBtn').addEventListener('click',importPlan);
  document.getElementById('reset').addEventListener('click',function(){
    if(confirm('确定清空全部打卡记录吗？此操作不可恢复。')){ store={}; save(); render(); } });

  render();
  renderMockRows();
  renderMockList();
  renderCharts();
})();
</script>
