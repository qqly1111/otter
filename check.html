<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考公打卡 · 考拉</title>
<style>
  :root{
    --bg:#eef2f0; --card:#ffffff; --text:#1c2a24; --sub:#7b8883;
    --green:#27a35e; --green-bg:#e7f6ed; --line:#e4eae7; --amber:#e39b2e; --amber-bg:#fdf3e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:14px 12px 40px;}
  .wrap{max-width:520px;margin:0 auto;}
  .card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;
    box-shadow:0 2px 10px rgba(20,50,35,.06);}
  .head{display:flex;justify-content:space-between;align-items:center;}
  .title{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .navbox{display:flex;align-items:center;gap:4px;}
  .navbox button{border:none;background:#eef4f0;color:#4b7a5f;width:26px;height:26px;border-radius:8px;font-size:12px;line-height:1;}
  .navbox .date{font-size:13px;color:var(--sub);min-width:70px;text-align:center;}
  .navbox .date.off{color:var(--amber);font-weight:600;}
  .stats{display:flex;gap:10px;margin-top:12px;}
  .stat{flex:1;background:var(--green-bg);border-radius:12px;padding:10px;text-align:center;}
  .stat.amber{background:var(--amber-bg);}
  .stat b{display:block;font-size:22px;color:var(--green);line-height:1.2;}
  .stat.amber b{color:var(--amber);}
  .stat span{font-size:11px;color:var(--sub);}
  .ct{font-size:14px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .ct .p{font-size:12px;font-weight:500;color:var(--sub);}
  .legend{font-size:11px;color:var(--sub);margin-bottom:10px;line-height:1.5;}
  .task{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:12px;
    border:1px solid var(--line);margin-bottom:8px;transition:.15s;cursor:pointer;user-select:none;}
  .task:active{transform:scale(.985);}
  .task .box{width:22px;height:22px;border-radius:7px;border:2px solid #cfd8d4;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.15s;}
  .task .txt{flex:1 1 auto;min-width:0;font-size:14px;line-height:1.3;word-break:break-all;}
  .task .din{flex:0 0 40px;width:40px;border:1px solid var(--line);border-radius:8px;padding:6px 2px;
    font-size:12px;outline:none;background:#fff;color:var(--text);text-align:center;}
  .task .din::placeholder{color:#c2cdc7;font-size:11px;}
  .task.done{background:var(--green-bg);border-color:#bfe6cd;}
  .task.done .box{background:var(--green);border-color:var(--green);}
  .task.done .txt{color:#5c6b64;}
  .task.half{background:var(--amber-bg);border-color:#f0d9ad;}
  .task.half .box{background:var(--amber);border-color:var(--amber);}
  .task.half .txt{color:#8a6a25;}
  .task .del{color:#c8d2ce;font-size:18px;padding:0 3px;flex:0 0 auto;}
  @keyframes flash{0%{background:#fff6d8;}100%{background:transparent;}}
  .task.flash{animation:flash 1.1s ease;}
  .addrow{display:flex;gap:6px;margin-top:8px;}
  .addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;outline:none;background:#fafcfb;}
  .addrow input:focus{border-color:var(--green);}
  .addrow input.err{border-color:#e0533d;background:#fdeeeb;}
  .addrow button{border:none;background:var(--green);color:#fff;border-radius:10px;padding:0 12px;font-size:12px;font-weight:600;white-space:nowrap;}
  .addrow button.alt{background:#eef4f0;color:#4b7a5f;}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day{border-radius:10px;padding:8px 2px;text-align:center;background:#f6f9f7;border:1px solid var(--line);}
  .day .d{font-size:11px;color:var(--sub);}
  .day .n{font-size:14px;font-weight:700;margin-top:2px;}
  .day.full{background:var(--green-bg);border-color:#bfe6cd;}
  .day.full .n{color:var(--green);}
  .day.today{border-color:var(--green);border-width:2px;}
  .day.view{border-color:var(--amber);border-width:2px;}
  .day .n.zero{color:#c8d2ce;font-weight:500;}
  .copybtn{width:100%;background:var(--green);color:#fff;border:none;border-radius:12px;padding:13px;
    font-size:15px;font-weight:600;letter-spacing:.5px;margin-bottom:8px;}
  .copybtn.alt{background:#eef4f0;color:#37724e;margin-bottom:0;}
  .copybtn:active{opacity:.88;}
  .hint{font-size:11px;color:var(--sub);text-align:center;margin-top:8px;line-height:1.6;}
  .foot{text-align:center;margin-top:6px;}
  .foot button{background:none;border:none;color:var(--sub);font-size:12px;padding:8px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="title">🐨 考公打卡</div>
      <div class="navbox">
        <button id="prevDay">◀</button>
        <span class="date" id="todayTxt" title="点我回到今天"></span>
        <button id="nextDay">▶</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="streak">0</b><span>连续打卡 (天)</span></div>
      <div class="stat amber"><b id="rate">0%</b><span>本周完成率</span></div>
    </div>
  </div>

  <div class="card">
    <div class="ct"><span id="taskTitle">今日任务</span> <span class="p" id="todayProg"></span></div>
    <div class="legend">点一下循环切换：✅完成 → ◐半完成 → ⬜未完成 ｜ 右侧两框随手填：<b>分</b>=用时(分钟)，<b>对</b>=对几题</div>
    <div id="tasks"></div>
    <div class="addrow">
      <input id="newTask" placeholder="加一条，如：立体图推" maxlength="30">
      <button id="addFocus">🎯攻克</button>
      <button id="addCustom" class="alt">📌任务</button>
    </div>
  </div>

  <div class="card">
    <div class="ct">本周概览 <span class="p">周一 → 周日</span></div>
    <div class="week" id="week"></div>
  </div>

  <div class="card">
    <button class="copybtn" id="copyBtn">📋 复制当天完成情况（发给我）</button>
    <button class="copybtn alt" id="importBtn">📥 导入次日计划（粘贴我发的）</button>
    <div class="hint">晚上：复制①→发我；收到我的计划→点②粘贴进去，当天自动生成</div>
  </div>

  <div class="foot">
    <button id="reset">清空全部打卡记录</button>
  </div>
</div>

<script>
(function(){
  var KEY='kaogong_daka_v5';
  var DAILY=[
    {id:'pol',name:'📰 午间 · 政治理论 / 常识积累'},
    {id:'data',name:'📊 下午 · 资料分析 1篇'},
    {id:'tui',name:'🧩 下午 · 图推 20题'},
    {id:'num',name:'🔢 下午 · 数量关系 10题',from:'2026-09-24'},
    {id:'yan',name:'📝 下午 · 言语逻辑填空 20题'},
    {id:'sl',name:'✍️ 晚上 · 综应 / 申论（动笔）'}
  ];
  var SPECIAL={
    1:[{id:'review',name:'📋 复盘日 · 上周（二~日）复盘整理'}],
    2:[{id:'mock',name:'📊 周二 · 模考'}],
    7:[{id:'mock',name:'📊 周日 · 模考'}]
  };
  var EMO={pol:'📰',data:'📊',tui:'🧩',num:'🔢',yan:'📝',sl:'✍️',review:'📋',mock:'📊'};
  var LBL={pol:'午间政治',data:'下午资料',tui:'图推20',num:'数量10',yan:'言语20',sl:'晚上申论',review:'复盘',mock:'模考'};
  var SYM=['⬜','✅','◐'];

  var store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){store={};}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
  function pad(n){return String(n).padStart(2,'0');}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  var weekNames=['日','一','二','三','四','五','六'];

  var viewDate=new Date();
  var justAdded=null;

  function rec(t){
    if(!store[t]) store[t]={states:{},t1:{},t2:{},focus:[],custom:[]};
    var r=store[t];
    if(!r.states) r.states={};
    if(!r.t1) r.t1={};
    if(!r.t2) r.t2={};
    if(!r.focus) r.focus=[];
    if(!r.custom) r.custom=[];
    return r;
  }
  function allTasks(t,day){
    var r=rec(t), arr=[];
    r.focus.forEach(function(f){ arr.push({id:f.id,name:'🎯 '+f.name,ref:f,type:'focus'}); });
    DAILY.forEach(function(d){ if(d.from && t<d.from) return; arr.push({id:d.id,name:d.name,type:'fix'}); });
    (SPECIAL[day]||[]).forEach(function(s){ arr.push({id:s.id,name:s.name,type:'fix'}); });
    r.custom.forEach(function(c){ arr.push({id:c.id,name:'📌 '+c.name,ref:c,type:'custom'}); });
    return arr;
  }
  function getState(t,item){ return item.type==='fix' ? (rec(t).states[item.id]||0) : (item.ref.state||0); }
  function setState(t,item,v){ if(item.type==='fix'){ rec(t).states[item.id]=v; } else { item.ref.state=v; } }
  function getN(t,item,k){ return item.type==='fix' ? (rec(t)[k][item.id]||'') : (item.ref[k]||''); }
  function setN(t,item,k,v){ if(item.type==='fix'){ rec(t)[k][item.id]=v; } else { item.ref[k]=v; } }
  function hasDone(t){ var r=store[t]; if(!r) return false; return Object.keys(r.states||{}).some(function(k){return r.states[k];}) || (r.focus||[]).some(function(f){return f.state;}) || (r.custom||[]).some(function(c){return c.state;}); }
  function streak(){ var c=0,d=new Date(); if(!hasDone(ymd(d))) d.setDate(d.getDate()-1); while(hasDone(ymd(d))){c++;d.setDate(d.getDate()-1);} return c; }
  function monday(d){ var x=new Date(d); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  function render(){
    var now=new Date(), tt=ymd(now);
    var dv=viewDate, vt=ymd(dv), vd=dv.getDay();
    var isToday=(vt===tt);
    var elT=document.getElementById('todayTxt');
    elT.textContent=(dv.getMonth()+1)+'/'+dv.getDate()+' 周'+weekNames[vd];
    elT.className='date'+(isToday?'':' off');
    document.getElementById('taskTitle').textContent=(isToday?'今日任务':((dv.getMonth()+1)+'/'+dv.getDate()+' 任务'));
    document.getElementById('streak').textContent=streak();

    var list=allTasks(vt,vd);
    var doneN=0;
    var box=document.getElementById('tasks');
    box.innerHTML='';
    list.forEach(function(x){
      var st=getState(vt,x);
      doneN += (st===1?1:(st===2?0.5:0));
      var item=document.createElement('div');
      item.className='task'+(st===1?' done':(st===2?' half':''));
      item.setAttribute('data-id',x.id);
      item.innerHTML='<div class="box">'+(st===1?'✓':(st===2?'◐':''))+'</div>'+
        '<div class="txt">'+x.name+'</div>'+
        '<input class="din d1" inputmode="numeric" placeholder="分" value="'+esc(getN(vt,x,'t1'))+'">'+
        '<input class="din d2" inputmode="numeric" placeholder="对" value="'+esc(getN(vt,x,'t2'))+'">'+
        (x.type!=='fix'?'<div class="del">×</div>':'');
      item.addEventListener('click',function(ev){
        if(ev.target.tagName==='INPUT'){ return; }
        if(ev.target.className && ev.target.className.indexOf('del')>-1){
          var r=rec(vt);
          if(x.type==='focus'){ r.focus=r.focus.filter(function(f){return f.id!==x.id;}); }
          else { r.custom=r.custom.filter(function(c){return c.id!==x.id;}); }
          save(); render(); return;
        }
        setState(vt,x,(st+1)%3); save(); render();
      });
      var i1=item.querySelector('.d1'), i2=item.querySelector('.d2');
      i1.addEventListener('input',function(){ var v=i1.value.replace(/[^\d]/g,''); if(v!==i1.value) i1.value=v; setN(vt,x,'t1',v); save(); });
      i2.addEventListener('input',function(){ var v=i2.value.replace(/[^\d]/g,''); if(v!==i2.value) i2.value=v; setN(vt,x,'t2',v); save(); });
      box.appendChild(item);
    });
    document.getElementById('todayProg').textContent=(Math.round(doneN*10)/10)+'/'+list.length;

    var ms=monday(dv), wk=document.getElementById('week'); wk.innerHTML='';
    var tot=0,dn=0;
    for(var i=0;i<7;i++){
      var d=new Date(ms); d.setDate(ms.getDate()+i);
      var td=ymd(d), dw=d.getDay();
      var ts=allTasks(td,dw);
      var c=0; ts.forEach(function(x){ var s=getState(td,x); c+=(s===1?1:(s===2?0.5:0)); });
      var isFuture=(d>now) && (td!==tt);
      if(!isFuture){ tot+=ts.length; dn+=c; }
      var dEl=document.createElement('div');
      dEl.className='day'+((c>=ts.length&&c>0)?' full':'')+((td===tt)?' today':'')+((td===vt)?' view':'');
      dEl.innerHTML='<div class="d">周'+weekNames[dw]+'</div><div class="n '+(c===0?'zero':'')+'">'+(Math.round(c*10)/10)+'/'+ts.length+'</div>';
      wk.appendChild(dEl);
    }
    document.getElementById('rate').textContent=(tot?Math.round(dn/tot*100):0)+'%';

    if(justAdded){
      var added=box.querySelector('[data-id="'+justAdded+'"]');
      if(added){ added.classList.add('flash'); try{ added.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }
      justAdded=null;
    }
  }

  function buildText(){
    var dv=viewDate, vt=ymd(dv), vd=dv.getDay();
    var list=allTasks(vt,vd);
    var s='【'+(dv.getMonth()+1)+'/'+dv.getDate()+' 打卡】';
    list.forEach(function(x){
      var st=getState(vt,x), a=getN(vt,x,'t1'), b=getN(vt,x,'t2');
      var nm=(x.type==='fix')? (LBL[x.id]||x.name) : x.name.replace(/^(?:🎯|📌)\s*/,'');
      var emo=(x.type==='fix')? (EMO[x.id]||'📌') : (x.type==='focus'?'🎯':'📌');
      var d=''; if(a||b){ d='('+(a?a+'分':'')+(a&&b?',':'')+(b?b+'对':'')+')'; }
      s+=' '+emo+nm+SYM[st]+d;
    });
    return s;
  }
  function copyText(txt){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ alert('已复制！\n\n'+txt+'\n\n粘贴到对话里发我吧～'); },
        function(){ manual(txt); });
    } else { manual(txt); }
  }
  function manual(txt){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    alert((ok?'已复制！\n\n':'请手动长按复制：\n\n')+txt);
  }
  function addItem(type){
    var inp=document.getElementById('newTask'); var v=inp.value.trim();
    if(!v){
      inp.classList.add('err'); inp.placeholder='先在这儿输入内容哦';
      inp.focus();
      setTimeout(function(){ inp.classList.remove('err'); inp.placeholder='加一条，如：立体图推'; }, 1600);
      return;
    }
    var r=rec(ymd(viewDate));
    var id=(type==='focus'?'f':'c')+Date.now();
    if(type==='focus'){ r.focus.push({id:id,name:v,state:0,t1:'',t2:''}); }
    else { r.custom.push({id:id,name:v,state:0,t1:'',t2:''}); }
    justAdded=id;
    inp.value=''; save(); render();
  }
  function parseDate(s){
    var m=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})$/);
    if(!m) return null;
    var d=new Date(new Date().getFullYear(), parseInt(m[1],10)-1, parseInt(m[2],10));
    return ymd(d);
  }
  function importPlan(){
    var s=prompt('粘贴 AI 发你的计划\n（形如：9/24|攻克:图推规律识别,立体图推|任务:订正模考卷）','');
    if(s===null) return;
    s=s.trim(); if(!s) return;
    var parts=s.split('|').map(function(x){return x.trim();}).filter(Boolean);
    var date=null, fo=[], cu=[];
    parts.forEach(function(p){
      var c=p.replace(/[\s🎯📌]/g,'');
      if(c.indexOf('攻克:')===0||c.indexOf('攻克：')===0){
        c.replace(/^攻克[:：]/,'').split(/[,，、]/).forEach(function(n){ if(n) fo.push(n); });
      } else if(c.indexOf('任务:')===0||c.indexOf('任务：')===0){
        c.replace(/^任务[:：]/,'').split(/[,，、]/).forEach(function(n){ if(n) cu.push(n); });
      } else {
        var d=parseDate(c); if(d) date=d;
      }
    });
    if(!date) date=ymd(new Date());
    var r=rec(date);
    r.focus = fo.map(function(n,i){ return {id:'f'+Date.now()+i, name:n, state:0, t1:'', t2:''}; });
    r.custom = cu.map(function(n,i){ return {id:'c'+Date.now()+i, name:n, state:0, t1:'', t2:''}; });
    save();
    var p=date.split('-'); viewDate=new Date(+p[0], +p[1]-1, +p[2]);
    render();
    alert('✅ 已导入到 '+(+date.slice(5,7))+'/'+(+date.slice(8,10))+'：\n🎯攻克 '+fo.length+' 项 ｜ 📌任务 '+cu.length+' 项\n\n已自动跳转到该日期');
  }

  document.getElementById('prevDay').addEventListener('click',function(){ viewDate.setDate(viewDate.getDate()-1); render(); });
  document.getElementById('nextDay').addEventListener('click',function(){ viewDate.setDate(viewDate.getDate()+1); render(); });
  document.getElementById('todayTxt').addEventListener('click',function(){ viewDate=new Date(); render(); });
  document.getElementById('addFocus').addEventListener('click',function(){ addItem('focus'); });
  document.getElementById('addCustom').addEventListener('click',function(){ addItem('custom'); });
  document.getElementById('newTask').addEventListener('keydown',function(e){ if(e.key==='Enter') addItem('focus'); });
  document.getElementById('copyBtn').addEventListener('click',function(){ copyText(buildText()); });
  document.getElementById('importBtn').addEventListener('click',importPlan);
  document.getElementById('reset').addEventListener('click',function(){
    if(confirm('确定清空全部打卡记录吗？此操作不可恢复。')){ store={}; save(); render(); }
  });

  render();
})();
</script>
</body>
</html>
